    <style>
      .mouse-pupil-tracker { position:absolute; z-index:30; pointer-events:none; border-radius:50%; display:block; }
      .mouse-pupil-tracker::before { content:""; position:absolute; inset:-42%; border-radius:50%; background:radial-gradient(circle, #6c3b1c 0 46%, #8a5a32 60%, rgba(138,90,50,0) 78%); }
      .mouse-pupil-tracker::after { content:""; position:absolute; left:50%; top:50%; width:46%; height:46%; transform:translate(-50%,-50%); border-radius:50%; background:#050505; box-shadow:0 0 1px rgba(0,0,0,.95), 0 0 4px rgba(0,0,0,.3); }
      .mouse-pupil-tracker.left { width:5.2%; height:5.2%; left:36.45%; top:44.05%; }
      .mouse-pupil-tracker.right { width:5.2%; height:5.2%; left:58.25%; top:44.05%; }
    </style>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
        let initialized = false;
        let raf = 0;
        let leftPupil = null;
        let rightPupil = null;
        let portrait = null;
        const target = { x: 0, y: 0 };
        const current = { x: 0, y: 0 };

        const render = () => {
          current.x += (target.x - current.x) * 0.3;
          current.y += (target.y - current.y) * 0.3;
          const transform = `translate3d(${current.x.toFixed(2)}px, ${current.y.toFixed(2)}px, 0)`;
          if (leftPupil) leftPupil.style.transform = transform;
          if (rightPupil) rightPupil.style.transform = transform;
          if (Math.max(Math.abs(target.x - current.x), Math.abs(target.y - current.y)) > 0.03) {
            raf = requestAnimationFrame(render);
          } else {
            current.x = target.x;
            current.y = target.y;
            raf = 0;
          }
        };

        const queue = () => { if (!raf) raf = requestAnimationFrame(render); };

        const attach = () => {
          if (initialized) return true;
          portrait = document.querySelector('.hero-memoji-portrait');
          if (!portrait) return false;

          /* Hide all previous experimental pupil/eyelid layers. */
          portrait.querySelectorAll('.hero-memoji-pupil-window, .hero-memoji-pupil-only-window, .hero-memoji-lid').forEach((node) => {
            node.style.setProperty('display', 'none', 'important');
          });

          leftPupil = document.createElement('span');
          rightPupil = document.createElement('span');
          leftPupil.className = 'mouse-pupil-tracker left';
          rightPupil.className = 'mouse-pupil-tracker right';
          portrait.append(leftPupil, rightPupil);

          const follow = (event) => {
            if (window.innerWidth < 768) return;
            const bounds = portrait.getBoundingClientRect();
            if (!bounds.width || !bounds.height) return;

            /* Use each eye's real center, so gaze follows the actual cursor direction. */
            const eyeCenterX = bounds.left + bounds.width * 0.5;
            const eyeCenterY = bounds.top + bounds.height * 0.468;
            const dx = event.clientX - eyeCenterX;
            const dy = event.clientY - eyeCenterY;

            /* Larger travel than before; still safely inside the iris. */
            target.x = clamp(dx / 12, -12, 12);
            target.y = clamp(dy / 12, -7, 7);
            queue();
          };

          window.addEventListener('mousemove', follow, { passive: true });
          initialized = true;
          return true;
        };

        const boot = () => {
          if (attach()) return;
          let tries = 0;
          const retry = () => {
            if (attach()) return;
            if (++tries < 100) setTimeout(retry, 100);
          };
          retry();
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', boot, { once: true });
        } else {
          boot();
        }
      })();
    </script>
